<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚀 صاروخ جدول الضرب</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at top,#1e1b4b 0%,#0f172a 60%,#020617 100%);color:#f8fafc;min-height:100vh;overflow-x:hidden}
  .stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 40px 70px,#fff,transparent),radial-gradient(1px 1px at 90px 40px,#fff,transparent),radial-gradient(2px 2px at 130px 80px,#fff,transparent),radial-gradient(1px 1px at 160px 20px,#fff,transparent);background-size:200px 120px;opacity:.6;animation:drift 60s linear infinite}
  @keyframes drift{to{background-position:0 1200px}}
  .wrap{position:relative;max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .card{background:rgba(255,255,255,.07);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px;text-align:center}
  h1{margin:0 0 6px;font-size:28px}
  .sub{color:#c7d2fe;font-size:14px;margin:0 0 18px}
  .tables{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
  .tables button{font-size:20px;padding:12px 0;border-radius:14px;border:2px solid transparent;background:#312e81;color:#fff;cursor:pointer;font-weight:800}
  .tables button.on{background:#f59e0b;color:#1e1b4b;border-color:#fde68a}
  .big{font:inherit;font-size:20px;font-weight:800;padding:14px 28px;border:0;border-radius:16px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#1e1b4b;cursor:pointer;box-shadow:0 10px 30px rgba(249,115,22,.4)}
  .big:disabled{opacity:.5;cursor:not-allowed}
  .hidden{display:none}
  .hud{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:10px;color:#e2e8f0}
  .sky{position:relative;height:220px;border-radius:18px;background:linear-gradient(to top,#0ea5e9 0%,#1e3a8a 50%,#020617 100%);overflow:hidden;margin-bottom:14px;border:1px solid rgba(255,255,255,.15)}
  .ground{position:absolute;bottom:0;left:0;right:0;height:22px;background:#15803d}
  .rocket{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:46px;transition:bottom .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px #fbbf24)}
  .flame{display:block;text-align:center;font-size:20px;margin-top:-10px;animation:fl .3s infinite alternate}
  @keyframes fl{from{opacity:.5;transform:scaleY(.8)}to{opacity:1;transform:scaleY(1.2)}}
  .moon{position:absolute;top:10px;right:16px;font-size:40px}
  .q{font-size:40px;font-weight:900;margin:8px 0 14px;letter-spacing:1px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opts button{font:inherit;font-size:26px;font-weight:800;padding:16px;border:0;border-radius:16px;background:#4f46e5;color:#fff;cursor:pointer;transition:.15s}
  .opts button:active{transform:scale(.96)}
  .ok{background:#16a34a!important}.bad{background:#dc2626!important}
  .fb{min-height:30px;font-weight:900;font-size:18px;margin-top:12px}
  .timer{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:10px 0}
  .timer i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);width:100%;transition:width 1s linear}
  .result{font-size:22px;margin:10px 0}
  .stars-earned{font-size:40px;letter-spacing:6px}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  td,th{padding:6px;border-bottom:1px solid rgba(255,255,255,.1)}
  .badge{display:inline-block;background:#fde68a;color:#78350f;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800}
  .foot{font-size:11px;color:#94a3b8;margin-top:18px}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">

  <!-- Start -->
  <div class="card" id="start">
    <h1>🚀 صاروخ جدول الضرب</h1>
    <p class="sub">أجيبي إجابات صحيحة ليصعد الصاروخ إلى القمر! 🌕</p>
    <p style="font-weight:800;margin:0">اختاري جدولاً أو أكثر:</p>
    <div class="tables" id="tables"></div>
    <p style="font-weight:800;margin:14px 0 6px">المستوى:</p>
    <div class="tables" style="grid-template-columns:repeat(3,1fr)" id="levels">
      <button data-l="1" class="on">🌱 مبتدئ</button>
      <button data-l="2">⭐ متوسط</button>
      <button data-l="3">🔥 متقدم</button>
    </div>
    <button class="big" id="go" onclick="startGame()">انطلقي 🚀</button>
  </div>

  <!-- Game -->
  <div class="card hidden" id="game">
    <div class="hud"><span>⭐ <b id="score">0</b></span><span id="lvlName" class="badge"></span><span>❓ <b id="n">1</b>/<b id="total">10</b></span></div>
    <div class="sky">
      <span class="moon">🌕</span>
      <div class="rocket" id="rocket">🚀<span class="flame">🔥</span></div>
      <div class="ground"></div>
    </div>
    <div class="timer" id="timerWrap"><i id="timer"></i></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
  </div>

  <!-- End -->
  <div class="card hidden" id="end">
    <h1 id="endTitle">🎉 وصل الصاروخ!</h1>
    <div class="stars-earned" id="starsEarned"></div>
    <p class="result">نتيجتك: <b id="final"></b> من <b id="finalTotal"></b></p>
    <p class="sub" id="msg"></p>
    <div id="review"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button class="big" onclick="location.reload()">🔄 لعبة جديدة</button>
      <button class="big" style="background:#334155;color:#fff" onclick="retryWrong()" id="retryBtn">✏️ تدرّبي على الأخطاء</button>
    </div>
  </div>

  <p class="foot">مبادرة معلمات مبدعات بالذكاء الاصطناعي – التعليم المجتمعي · تعمل بدون إنترنت</p>
</div>

<script>
const T = document.getElementById('tables');
let chosen = new Set([2]);
for (let t = 1; t <= 10; t++) {
  const b = document.createElement('button'); b.textContent = t; if (chosen.has(t)) b.classList.add('on');
  b.onclick = () => { if (chosen.has(t)) { if (chosen.size > 1) { chosen.delete(t); b.classList.remove('on'); } } else { chosen.add(t); b.classList.add('on'); } };
  T.appendChild(b);
}
let level = 1;
document.querySelectorAll('#levels button').forEach(b => b.onclick = () => { document.querySelectorAll('#levels button').forEach(x => x.classList.remove('on')); b.classList.add('on'); level = +b.dataset.l; });

const LEVELS = { 1: { name: '🌱 مبتدئ', time: 0, maxB: 5, total: 8 }, 2: { name: '⭐ متوسط', time: 12, maxB: 10, total: 10 }, 3: { name: '🔥 متقدم', time: 7, maxB: 12, total: 12 } };
let qs = [], i = 0, score = 0, wrong = [], tInt = null, tLeft = 0;

function rnd(n) { return Math.floor(Math.random() * n); }
function beep(f, d = .15) { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); const g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d); o.start(); o.stop(c.currentTime + d); } catch (e) { } }
function makeQ(L) {
  const arr = [...chosen]; const a = arr[rnd(arr.length)]; const b = rnd(L.maxB) + 1; const ans = a * b;
  const flip = level === 3 && Math.random() < .5;
  const set = new Set([ans]);
  while (set.size < 4) { const d = [ans + a, ans - a, ans + b, ans - b, ans + 1, ans - 1, (a + 1) * b, a * (b + 1)][rnd(8)]; if (d > 0 && d !== ans) set.add(d); }
  return { t: flip ? `${b} × ${a} = ؟` : `${a} × ${b} = ؟`, a, b, ans, opts: [...set].sort(() => Math.random() - .5) };
}
function startGame(custom) {
  const L = LEVELS[level]; qs = custom || Array.from({ length: L.total }, () => makeQ(L)); i = 0; score = 0; wrong = [];
  document.getElementById('start').classList.add('hidden'); document.getElementById('end').classList.add('hidden'); document.getElementById('game').classList.remove('hidden');
  document.getElementById('total').textContent = qs.length; document.getElementById('lvlName').textContent = L.name; document.getElementById('score').textContent = 0;
  document.getElementById('timerWrap').style.display = L.time ? 'block' : 'none';
  document.getElementById('rocket').style.bottom = '22px';
  show();
}
function show() {
  const q = qs[i]; document.getElementById('q').textContent = q.t; document.getElementById('n').textContent = i + 1; document.getElementById('fb').textContent = '';
  const o = document.getElementById('opts'); o.innerHTML = '';
  q.opts.forEach(v => { const b = document.createElement('button'); b.textContent = v; b.onclick = () => pick(b, v); o.appendChild(b); });
  const L = LEVELS[level]; clearInterval(tInt);
  if (L.time) { tLeft = L.time; const bar = document.getElementById('timer'); bar.style.transition = 'none'; bar.style.width = '100%'; setTimeout(() => { bar.style.transition = 'width 1s linear'; }, 20); tInt = setInterval(() => { tLeft--; bar.style.width = (tLeft / L.time * 100) + '%'; if (tLeft <= 0) { clearInterval(tInt); pick(null, null); } }, 1000); }
}
function pick(b, v) {
  clearInterval(tInt); const q = qs[i]; const all = [...document.querySelectorAll('#opts button')]; all.forEach(x => x.disabled = true);
  const fb = document.getElementById('fb');
  if (v === q.ans) { b.classList.add('ok'); score++; document.getElementById('score').textContent = score; fb.textContent = ['رائع! 🌟', 'ممتازة! 🚀', 'أحسنتِ! 👏', 'صحيح! ✅'][rnd(4)]; fb.style.color = '#4ade80'; beep(880); setTimeout(() => beep(1320), 120); }
  else { if (b) b.classList.add('bad'); all.find(x => +x.textContent === q.ans).classList.add('ok'); fb.textContent = (v === null ? '⏰ انتهى الوقت! ' : '❌ ') + `${q.a} × ${q.b} = ${q.ans}`; fb.style.color = '#fca5a5'; wrong.push(q); beep(200, .3); }
  const pct = score / qs.length; document.getElementById('rocket').style.bottom = (22 + pct * 140) + 'px';
  setTimeout(() => { i++; if (i < qs.length) show(); else end(); }, 1300);
}
function end() {
  document.getElementById('game').classList.add('hidden'); document.getElementById('end').classList.remove('hidden');
  const pct = score / qs.length; document.getElementById('final').textContent = score; document.getElementById('finalTotal').textContent = qs.length;
  const stars = pct >= .9 ? 3 : pct >= .6 ? 2 : pct > 0 ? 1 : 0; document.getElementById('starsEarned').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('endTitle').textContent = pct >= .9 ? '🌕 وصل الصاروخ إلى القمر!' : pct >= .6 ? '🚀 اقترب الصاروخ كثيراً!' : '🛠️ الصاروخ يحتاج وقوداً أكثر';
  document.getElementById('msg').textContent = pct >= .9 ? 'أنتِ رائدة فضاء في جدول الضرب! 🏆' : pct >= .6 ? 'جيد جداً! تدرّبي على الأخطاء لتصلي إلى القمر.' : 'لا بأس، كل محاولة تجعلك أقوى. جرّبي جدولاً واحداً أولاً.';
  const r = document.getElementById('review'); r.innerHTML = '';
  if (wrong.length) { r.innerHTML = '<table><tr><th>المسألة</th><th>الإجابة الصحيحة</th></tr>' + wrong.map(q => `<tr><td>${q.a} × ${q.b}</td><td><b>${q.ans}</b></td></tr>`).join('') + '</table>'; document.getElementById('retryBtn').style.display = 'inline-block'; } else document.getElementById('retryBtn').style.display = 'none';
  if (stars === 3) { beep(660); setTimeout(() => beep(880), 150); setTimeout(() => beep(1100), 300); }
}
function retryWrong() { if (!wrong.length) return; const again = wrong.map(q => ({ ...q, opts: [...q.opts].sort(() => Math.random() - .5) })); startGame(again); }
</script>
</body>
</html>
